name: Standalone alpha acceptance
# Repository-root workflow; no other research checkout or live providers required.
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# CP7 capture evidence reviewed explicitly; every delivery requires strict comparison.
# A future capture phase still cannot deliver a development wheel.
env:
  BROWSER_VISUAL_MODE: capture
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Provenance regressions check frozen CP6/CP7 Git objects, not only HEAD.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Build and lint in a developer environment
        run: |
          python -m pip install --upgrade 'pip==26.2'
          python -m pip install -c tools/validation-constraints.txt '.[dev]' setuptools
          python -m ruff check src tests tools browser_tests
          python -m build --no-isolation
      - name: Core clean installation and offline tests
        run: |
          python -m venv /tmp/ct-core
          /tmp/ct-core/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ct-core/bin/python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_*.py'
          /tmp/ct-core/bin/python -I -m corpustrail.tutorial /tmp/ct-tutorial-core
      - name: Optional ML clean installation and tests
        run: |
          python -m venv /tmp/ct-ml
          CT_WHEEL=$(ls dist/*.whl)
          /tmp/ct-ml/bin/python -m pip install -c tools/validation-constraints.txt "${CT_WHEEL}[prioritization]"
          /tmp/ct-ml/bin/python -m pip download -c tools/validation-constraints.txt --only-binary=:all: --dest /tmp/ct-dependency-wheels 'scikit-learn>=1.5,<2'
          cd /tmp
          /tmp/ct-ml/bin/python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_*.py'
          /tmp/ct-ml/bin/python -I -m corpustrail.tutorial /tmp/ct-tutorial-ml --prioritize
      - name: Independent wheel and sdist install/acceptance
        run: python tools/smoke_install.py --dependency-wheels /tmp/ct-dependency-wheels
      - name: Two thousand exact synthetic references / actual scientific services
        if: matrix.python == '3.13'
        run: /tmp/ct-core/bin/python -I tools/reference_acceptance.py --project "$RUNNER_TEMP/reference-scale" --papers 2000
      - name: Check code-only release population
        run: python tools/release_manifest.py
  project-lifecycle:
    name: Project lifecycle (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ['macos-15', 'windows-latest']
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Core installation and real-process guards (no native dependency)
        # Fail at the first failed native command, including on Windows.
        shell: bash
        run: |
          python -m pip install --upgrade 'pip==26.2'
          python -m pip install --no-deps .
          python -I -m unittest discover -s tests -p test_project_management.py -v
          python -I -m unittest discover -s tests -p test_guided_review.py -v
          python -I -m unittest discover -s tests -p test_populations.py -v
          python -I -m unittest discover -s tests -p test_population_app.py -v
          python -I -m unittest discover -s tests -p 'test_reference*.py' -v
          python -I -m unittest discover -s tests -p test_discovery_app.py -v
          python -I -m unittest discover -s tests -p test_discovery_transport_diagnostics.py -v
          python -I -m unittest discover -s tests -p test_evidence_app.py -v
          python -I -m unittest discover -s tests -p test_evidence_diagnostic.py -v
          python -I -m unittest discover -s tests -p test_xml_safety.py -v
          python -I -m unittest discover -s tests -p test_jats_compatibility.py -v
          python -I -m unittest discover -s tests -p test_jats_text_preservation.py -v
          python -c "import platform; print(platform.platform(), platform.machine())"
      - name: Install only the approved macOS native bindings
        if: runner.os == 'macOS'
        run: |
          python -m pip install --only-binary=:all: '.[macos-trash]'
      - name: Native macOS Trash and independent-process acceptance
        if: runner.os == 'macOS'
        env:
          CORPUSTRAIL_NATIVE_TRASH_TEST: '1'
        run: |
          python -I -m unittest discover -s tests -p test_project_management.py -v
          python -I -m unittest discover -s tests -p test_discovery_app.py -v
          python -I -m unittest discover -s tests -p test_evidence_app.py -v
  browser-acceptance:
    name: Offline Chromium / reviewed Linux visual baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      visual_mode: '${{ steps.visual-mode.outputs.mode }}'
      acceptance: '${{ steps.browser-report.outputs.acceptance }}'
    steps:
      - name: Record explicit visual phase
        id: visual-mode
        run: echo "mode=$BROWSER_VISUAL_MODE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned developer browser tools and actual wheel
        run: |
          python -m pip install --upgrade 'pip==26.2'
          python -m pip install -r tools/browser-requirements.txt build setuptools
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-dejavu-core
      - name: Actual packaged application / offline scientific fixtures / visual checks
        id: browser-report
        run: |
          python -m unittest browser_tests.test_infrastructure browser_tests.test_path_visual_debt -v
          python tools/browser_acceptance.py --visual "$BROWSER_VISUAL_MODE" --output browser-acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: 'browser-acceptance-linux-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}'
          path: browser-acceptance/
          retention-days: 7
          if-no-files-found: error
  # Retain this historical job ID for development-artifact dependency compatibility.
  browser-macos-smoke:
    name: Full macOS Chromium and WebKit / offline acceptance
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      visual_mode: '${{ steps.visual-mode.outputs.mode }}'
      chromium_acceptance: '${{ steps.chromium-report.outputs.acceptance }}'
      webkit_acceptance: '${{ steps.webkit-report.outputs.acceptance }}'
    steps:
      - name: Record explicit visual phase
        id: visual-mode
        run: echo "mode=$BROWSER_VISUAL_MODE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned browser tools and actual wheel
        run: |
          python -m pip install --upgrade 'pip==26.2'
          python -m pip install -r tools/browser-requirements.txt build setuptools
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
          python -m playwright install chromium webkit
      - name: Complete Chromium / reviewed macOS visual comparisons
        id: chromium-report
        run: python tools/browser_acceptance.py --browser chromium --visual "$BROWSER_VISUAL_MODE" --allow-cp7-path-reflow --output browser-acceptance/chromium
      - name: Complete WebKit / reviewed macOS visual comparisons
        id: webkit-report
        if: success() || failure()
        run: python tools/browser_acceptance.py --browser webkit --visual "$BROWSER_VISUAL_MODE" --allow-cp7-path-reflow --output browser-acceptance/webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: 'browser-acceptance-macos-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}'
          path: browser-acceptance/
          retention-days: 7
          if-no-files-found: error
  development-artifact:
    name: Validated development wheel (not a release)
    needs: [acceptance, project-lifecycle, browser-acceptance, browser-macos-smoke]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/heads/development/') &&
      needs.browser-acceptance.outputs.visual_mode == 'compare' &&
      needs.browser-macos-smoke.outputs.visual_mode == 'compare'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHECKPOINT_IMPLEMENTATION_SHA: '6e116118f05e53ec3694c60e9171cb873a437bf8'
      CHECKPOINT_DISTRIBUTION_SHA: '7086456aabd4c4edd124bddc12d6fb93ecf5017e'
      ACCEPTED_CHECKPOINT1_SHA: '88fd3b9e787de869187d72bb7e0c3d634bacf53f'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build wheel from the exact run commit
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install --upgrade 'pip==26.2'
          python tools/development_artifact.py check-source --expected-commit "$GITHUB_SHA" --implementation-commit "$CHECKPOINT_IMPLEMENTATION_SHA" --distribution-commit "$CHECKPOINT_DISTRIBUTION_SHA" --accepted-checkpoint1 "$ACCEPTED_CHECKPOINT1_SHA"
          python -m pip install -c tools/validation-constraints.txt '.[dev]' setuptools
          python -m build --wheel --no-isolation
      - name: Validate the actual downloadable wheel in a clean core environment
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m venv "$RUNNER_TEMP/ct-development-core"
          "$RUNNER_TEMP/ct-development-core/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ct-development-core/bin/python" -I -B -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_*.py' > "$RUNNER_TEMP/development-tests.txt" 2>&1
          "$RUNNER_TEMP/ct-development-core/bin/python" -I -B -m corpustrail.tutorial "$RUNNER_TEMP/ct-development-tutorial" > "$RUNNER_TEMP/development-tutorial.json"
          "$RUNNER_TEMP/ct-development-core/bin/corpustrail" --version > "$RUNNER_TEMP/development-version.txt"
      - name: Assemble source identity, checksums and validation receipt
        id: bundle
        env:
          LINUX_BROWSER_ACCEPTANCE: '${{ needs.browser-acceptance.outputs.acceptance }}'
          MACOS_CHROMIUM_ACCEPTANCE: '${{ needs.browser-macos-smoke.outputs.chromium_acceptance }}'
          MACOS_WEBKIT_ACCEPTANCE: '${{ needs.browser-macos-smoke.outputs.webkit_acceptance }}'
        run: |
          python tools/development_artifact.py bundle --expected-commit "$GITHUB_SHA" --implementation-commit "$CHECKPOINT_IMPLEMENTATION_SHA" --distribution-commit "$CHECKPOINT_DISTRIBUTION_SHA" --accepted-checkpoint1 "$ACCEPTED_CHECKPOINT1_SHA" --validation-dir "$RUNNER_TEMP" --output-dir "$RUNNER_TEMP/corpustrail-development-artifact" --browser-acceptance-json "[$LINUX_BROWSER_ACCEPTANCE,$MACOS_CHROMIUM_ACCEPTANCE,$MACOS_WEBKIT_ACCEPTANCE]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: '${{ steps.bundle.outputs.artifact_name }}'
          path: '${{ runner.temp }}/corpustrail-development-artifact/'
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Show tester download link
        env:
          ARTIFACT_URL: '${{ steps.upload.outputs.artifact-url }}'
        run: |
          printf '\n[Download validated development wheel](%s)\n\nNot a public release. Artifact source/build commit: `%s`.\n\nCheckpoint 1 implementation commit: `%s`.\n\nPrevious CI/distribution commit: `%s`.\n' "$ARTIFACT_URL" "$GITHUB_SHA" "$CHECKPOINT_IMPLEMENTATION_SHA" "$CHECKPOINT_DISTRIBUTION_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '\nAccepted Checkpoint 1 visual baseline: `%s`. This wheel includes guided configuration, discovery, evidence acquisition, human review, frozen candidate populations and Checkpoint 7 reference/context provenance. Reference labels do not publish membership; no classifier engine runs. It is built from the source SHA above.\n' "$ACCEPTED_CHECKPOINT1_SHA" >> "$GITHUB_STEP_SUMMARY"

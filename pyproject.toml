[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-trail"
version = "0.1.0a1"
description = "Provenance-rich discovery, evidence and human curation of broad scientific topic corpora"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
prioritization = ["scikit-learn>=1.5,<2"]
dev = ["build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
corpustrail = "corpustrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corpustrail = ["operational/schema/*.sql", "operational/schema_manifest.json", "resources/*.json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Small correctness gate, no mass style rewrite of provenance-guarded code.
select = ["F821", "F822", "F823"]
